# LabGuide AI vazifalari: Claude API orqali ikkinchi fikr (content_review, ru_terminology,
# quiz_draft, translate_check). FAQAT qo'lda: Actions -> "AI tasks" -> Run workflow.
# Hech qachon pull_request / pull_request_target / push / schedule bilan ishga tushmaydi.
#
# Xavfsizlik tuzilmasi (tool/ai/README.md):
#   * `run` ishi: contents: read. ANTHROPIC_API_KEY FAQAT shu ishdagi bitta Python qadamining env'ida
#     (dry_run=true bo'lsa umuman berilmaydi). Kalit diskka, artifact'ga, logga yozilmaydi.
#   * `publish` ishi: contents: write, lekin kalit YO'Q va repodagi kod ishga tushmaydi — faqat
#     tayyor hisobotlarni `ai-reports` tarmog'iga yuboradi (main'ga hech qachon). Artifact checkout'dan KEYIN
#     va ish papkasidan tashqariga (runner.temp) yuklanadi — checkout ish papkasini tozalaydi.
#   * Barcha kiritmalar env orqali beriladi (${{ }} ni shell matniga qo'shilmaydi).
#   * Uchinchi tomon action'lar commit SHA bo'yicha mahkamlangan (izohda versiya).
#   * Natijalar — takliflar; ilova mazmuni avtomatik o'zgarmaydi va main'ga qo'shilmaydi (D-55).
name: AI tasks
run-name: "AI tasks - ${{ inputs.task }} (${{ inputs.dry_run && 'dry run' || 'LIVE' }})"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "content_review - manbaga nisbatan mazmun tekshiruvi; ru_terminology - rus terminlari; quiz_draft - test savollari qoralamasi; translate_check - uz/ru/en moslik"
        type: choice
        options: [content_review, ru_terminology, quiz_draft, translate_check]
        default: content_review
        required: true
      target:
        description: "Nima tekshiriladi: cytology | spermogram | bloodgroup | analytes | conditions | analyte:alt | condition:<id> | group:liver | pack | all-small | repo yo'li (.dart). Vergul bilan bir nechta"
        type: string
        default: all-small
        required: true
      model:
        description: "Model (claude-opus-5-5 faqat content_review uchun)"
        type: choice
        options: [claude-sonnet-5-5, claude-opus-5-5]
        default: claude-sonnet-5-5
      max_items:
        description: "Eng ko'pi bilan nechta element (qat'iy chegara: 60)"
        type: number
        default: 20
      dry_run:
        description: "true - faqat nima yuborilishi va taxminiy token/narx ro'yxati; API chaqirilmaydi"
        type: boolean
        default: true
      budget_usd:
        description: "Bir ishga tushirish uchun USD chegarasi (standart 3, eng ko'pi 10)"
        type: string
        default: "3"

permissions: {}

# Har bir vazifa+target uchun alohida guruh. GitHub bitta guruhda faqat BITTA kutayotgan run'ni saqlaydi va
# eskisini bekor qiladi — umumiy `ai-tasks` guruhida 3 ta dispatch'ning uchinchisi (translate_check) shu sabab
# CANCELLED bo'lgan. Endi turli vazifalar parallel ishlaydi; bir xil vazifa+target qayta bosilsa navbatga turadi.
# (Hisobot nomlari vazifa+target bo'yicha, publish esa ai-reports'ga force'siz yuboradi — pastga qarang.)
concurrency:
  group: ai-tasks-${{ inputs.task }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      reports: ${{ steps.collect.outputs.reports }}
    steps:
      - name: Faqat main tarmog'idan
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::ai_tasks faqat main tarmog'idan ishga tushiriladi (kalit tasdiqlanmagan kodga berilmaydi)."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Oflayn testlar (kalitsiz)
        run: |
          set -euo pipefail
          python -m unittest discover -s tool/ai/tests

      - name: SDK o'rnatish (rasmiy anthropic, aniq versiya)
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check -r tool/ai/requirements.txt

      # Kalit FAQAT shu qadamning env'ida. `set +x`: buyruqlar logga chiqarilmasin.
      - name: AI vazifasini bajarish
        env:
          ANTHROPIC_API_KEY: ${{ inputs.dry_run == false && secrets.ANTHROPIC_API_KEY || '' }}
          AI_TASK: ${{ inputs.task }}
          AI_TARGET: ${{ inputs.target }}
          AI_MODEL: ${{ inputs.model }}
          AI_MAX_ITEMS: ${{ inputs.max_items }}
          AI_BUDGET_USD: ${{ inputs.budget_usd }}
          AI_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          set +x
          if [ "$AI_DRY_RUN" != "true" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret topilmadi (Settings -> Secrets and variables -> Actions). API chaqirilmadi."
            exit 3
          fi
          args=(--task "$AI_TASK" --target "$AI_TARGET" --model "$AI_MODEL" --max-items "$AI_MAX_ITEMS" --budget-usd "$AI_BUDGET_USD")
          if [ "$AI_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -u tool/ai/run_task.py "${args[@]}"

      - name: Hisobotlar bormi?
        id: collect
        if: ${{ always() && inputs.dry_run == false }}
        run: |
          if compgen -G "docs/ai_reports/*.json" > /dev/null; then
            echo "reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "reports=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hisobotlarni artifact sifatida yuklash
        if: ${{ always() && steps.collect.outputs.reports == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-report-${{ github.run_id }}
          path: docs/ai_reports/
          if-no-files-found: ignore
          retention-days: 30

  # Kalitsiz ish: faqat tayyor hisobotlarni `ai-reports` tarmog'iga yuboradi (main'ga emas).
  publish:
    needs: run
    if: ${{ always() && inputs.dry_run == false && needs.run.outputs.reports == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Tartib muhim: actions/checkout ish papkasini tozalaydi ("Deleting the contents of ..."). Ilgari artifact
      # avval `incoming/` ga yuklanib, checkout uni o'chirgan -> "Hisobot yo'q". Endi avval checkout, artifact esa
      # ish papkasidan TASHQARIGA (runner.temp).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      # upload-artifact `path: docs/ai_reports/` fayllarni artifact ildiziga joylaydi -> bu yerda <path>/<fayl>.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ai-report-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-incoming

      - name: ai-reports tarmog'iga yuborish
        env:
          AI_INCOMING: ${{ runner.temp }}/ai-incoming
        run: |
          set -euo pipefail
          set +x
          # 1) Kiruvchi fayllarni tekshirish: faqat kutilgan nomlar, kalitga o'xshash matn yo'q.
          shopt -s nullglob
          files=("$AI_INCOMING"/*)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::Hisobot yo'q"; exit 1; }
          for f in "${files[@]}"; do
            b=$(basename "$f")
            if ! [[ "$b" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z_]+_[a-z0-9-]+(_r[0-9]+)?\.(md|json)$ ]]; then
              echo "::error::Kutilmagan fayl nomi: $b"; exit 1
            fi
            if grep -q -E 'sk-ant-[A-Za-z0-9_-]{8,}' "$f"; then
              echo "::error::Faylda kalitga o'xshash matn: $b - yuborilmadi"; exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2-4) ai-reports'ning eng so'nggi holati ustiga commit. Turli vazifalar endi parallel ishlaydi, shuning
          # uchun push rad etilsa (boshqa run oldinroq yubordi) — yangi uchidan qaytadan quriladi (force YO'Q).
          pushed=false
          for attempt in 1 2 3 4; do
            # 2) ai-reports tarmog'i (bo'lmasa yangi, tarixsiz).
            if git ls-remote --exit-code --heads origin ai-reports > /dev/null 2>&1; then
              git fetch --depth=1 origin ai-reports
              git switch --discard-changes -C ai-reports FETCH_HEAD
              git clean -ffdq
            else
              git switch --discard-changes --orphan ai-reports
              git clean -ffdq
              cat > README.md <<'EOF'
          # ai-reports

          Bu tarmoq `AI tasks` workflow'i tomonidan avtomatik to'ldiriladi (docs/DECISIONS.md D-55).
          Ichida Claude modelining TAKLIFLARI bor - odam tekshiruvi shart. Bu tarmoqni main'ga
          qo'shmang (merge qilmang): kerakli xulosalarni qo'lda ko'chiring.
          EOF
            fi

            # 3) Nusxalash (mavjud fayl ustiga yozilmaydi: nomga run raqami qo'shiladi).
            mkdir -p docs/ai_reports
            for f in "${files[@]}"; do
              b=$(basename "$f")
              dest="docs/ai_reports/$b"
              if [ -e "$dest" ]; then
                dest="docs/ai_reports/${b%.*}_run${GITHUB_RUN_ID}.${b##*.}"
              fi
              cp "$f" "$dest"
            done

            # 4) Faqat docs/ai_reports/** va README.md o'zgarishi mumkin.
            git add docs/ai_reports
            if [ -f README.md ]; then git add README.md; fi
            bad=$(git diff --cached --name-only | grep -v -E '^(docs/ai_reports/[^/]+|README\.md)$' || true)
            if [ -n "$bad" ]; then
              echo "::error::Kutilmagan o'zgarishlar: $bad"; exit 1
            fi
            if git diff --cached --quiet; then
              echo "O'zgarish yo'q"; exit 0
            fi
            git commit -q -m "ai-reports: run ${GITHUB_RUN_ID} (${#files[@]} file(s))"
            # Aniq refspec: faqat ai-reports (main'ga hech qachon, force'siz).
            if git push origin HEAD:refs/heads/ai-reports; then
              pushed=true; break
            fi
            echo "::warning::push rad etildi (urinish $attempt/4) - ai-reports yangilangan, qaytadan quriladi"
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ] || { echo "::error::ai-reports'ga yuborib bo'lmadi"; exit 1; }
          echo "Hisobotlar: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/ai-reports/docs/ai_reports" >> "$GITHUB_STEP_SUMMARY"
