  <g id="text_3">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="-26.7225" transform="rotate(-0 -73.44 -26.7225)">12  Yuzaki yassi epiteliy hujayrasi</text>
  </g>
  <g id="text_4">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58756a" x="-73.44" y="-13.824" transform="rotate(-0 -73.44 -13.824)">Pap</text>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58756a" x="-73.44" y="243.216" transform="rotate(-0 -73.44 243.216)">MORFOLOGIK SXEMA • MIKROFOTO EMAS</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="268.934531" transform="rotate(-0 -73.44 268.934531)">1. Keng, yassi, ko‘p burchakli sitoplazma.</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="284.054531" transform="rotate(-0 -73.44 284.054531)">2. Kichik, zich (piknotik) yadro.</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="299.174531" transform="rotate(-0 -73.44 299.174531)">Pushti rang ko‘p uchraydi, ammo bo‘yalish rangi doim bir xil bo‘lmaydi.</text>
  </g>
  <g id="text_9">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58756a" x="-73.44" y="355.104" transform="rotate(-0 -73.44 355.104)">Manba: S1  |  Masshtab va ranglar shartli</text>
  </g>
 </g>
