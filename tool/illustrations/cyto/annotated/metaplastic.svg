   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="268.934531" transform="rotate(-0 -73.44 268.934531)">1. Zich sitoplazma, dumaloq/oval, odatda muntazam yadro.</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="284.054531" transform="rotate(-0 -73.44 284.054531)">2. Ayrim hujayralarda burchakli kontur yoki sitoplazmatik o‘simta.</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="299.174531" transform="rotate(-0 -73.44 299.174531)">Faqat o‘simtaga qarab tanilmaydi; yetilishiga qarab ko‘rinish o‘zgaradi.</text>
  </g>
  <g id="text_9">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58756a" x="-73.44" y="355.104" transform="rotate(-0 -73.44 355.104)">Manba: S3  |  Masshtab va ranglar shartli</text>
  </g>
 </g>
