  </g>
  <g id="text_7">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="284.054531" transform="rotate(-0 -73.44 284.054531)">2. Yuzaki hujayradagidan kattaroq, pufaksimon yadro.</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153e37" x="-73.44" y="299.174531" transform="rotate(-0 -73.44 299.174531)">Yadro qiyoslashga yordam beradi; o‘lcham preparat va holatga qarab</text>
  </g>
  <g id="text_9">
